; SuperGarageV settings. Keys are Windows virtual-key codes (decimal). 117 = F6
[Keys]
; Opens/closes the SuperGarageV menu
MenuKey=117

[Spawn]
; 1 = put you in the driver's seat of the vehicle you spawn
PutMeInVehicle=1
; 1 = remove the last vehicle you spawned (unless you're sitting in it) when you spawn another
DeletePreviousSpawn=1

[Sound]
; 1 = every vehicle you get in uses the Dodge Challenger (Gauntlet Hellfire) V8 engine sound
ChallengerSoundEverywhere=0

[AddOns]
; Spawn names of add-on vehicles you installed yourself (from each mod's readme), one per line,
; Vehicle1 to Vehicle32. They appear on the "Add-on vehicles" page when the game has them.
; Example:  Vehicle1=yourmodname
