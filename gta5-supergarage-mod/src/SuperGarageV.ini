; SuperGarageV settings. Keys are Windows virtual-key codes (decimal). 117 = F6
[Keys]
; Opens/closes the SuperGarageV menu
MenuKey=117

[Spawn]
; 1 = put you in the driver's seat of the vehicle you spawn
PutMeInVehicle=1
; 1 = remove the last vehicle you spawned (unless you're sitting in it) when you spawn another
DeletePreviousSpawn=1
