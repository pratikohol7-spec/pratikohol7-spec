; PossessionV settings. Keys are Windows virtual-key codes (decimal).
; 116 = F5, 118 = F7, 119 = F8, 120 = F9, 121 = F10, 122 = F11, 123 = F12
[Keys]
; Opens/closes the PossessionV menu
MenuKey=118
; Possess the marked target (pink marker over a nearby ped; the nearest one by default)
PossessPedKey=120
; Mark the next nearby ped as the target
NextTargetKey=116
; Possess the nearest animal
PossessAnimalKey=121
; Return to your original character
ReturnKey=122
; Vanilla Unicorn doors: UNLOCK / LOCK (LOCK restores the original door states)
DoorsKey=119
; Pedestrian possession mode ON / OFF
PossessionModeKey=123

[Possession]
; 1 = possession mode starts ON
Enabled=1
; 0 = never possess peds that a mission/story script owns (safer); 1 = allow them
AllowMissionPeds=0
; 1 = show a marker over the current target while possession mode is ON
ShowTargetMarker=1
; 1 = clear the wanted level when you return to your original character
ClearWantedOnReturn=0
; Search radius in metres (5-300)
MaxDistance=60
; 1 = your original character is invincible and stands still while you are away
ProtectOriginal=1
; 1 = if the possessed body dies, switch straight back to your original character
AutoReturnOnDeath=1

[VanillaUnicorn]
; 1 = start with the front, back, office and dressing-room doors UNLOCKED near the club
; (the menu / DoorsKey switches to LOCKED, which restores the doors' original states)
UnlockDoors=1
; 1 = re-enable the club interior if the game has it disabled/capped
EnableInterior=1

[Unlocks]
; 1 = no wanted level inside Fort Zancudo, Humane Labs, Bolingbroke prison and LSIA
RestrictedAreasNoWanted=1
; 1 = never get a wanted level anywhere
NeverWanted=0
; 1 = every body you possess (people, not animals) gets all weapons
AutoGiveWeapons=0
; Money added per menu press to Michael, Franklin or Trevor
MoneyAmount=1000000
