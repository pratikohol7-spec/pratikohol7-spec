; PossessionV settings. Keys are Windows virtual-key codes (decimal).
; 118 = F7, 120 = F9, 121 = F10, 122 = F11
[Keys]
; Opens/closes the PossessionV menu
MenuKey=118
; Possess the nearest pedestrian
PossessPedKey=120
; Possess the nearest animal
PossessAnimalKey=121
; Return to your original character
ReturnKey=122

[Possession]
; Search radius in metres (5-300)
MaxDistance=60
; 1 = your original character is invincible and stands still while you are away
ProtectOriginal=1
; 1 = if the possessed body dies, switch straight back to your original character
AutoReturnOnDeath=1

[VanillaUnicorn]
; 1 = keep the front, back, office and dressing-room doors unlocked near the club
UnlockDoors=1
; 1 = re-enable the club interior if the game has it disabled/capped
EnableInterior=1

[Unlocks]
; 1 = no wanted level inside Fort Zancudo, Humane Labs, Bolingbroke prison and LSIA
RestrictedAreasNoWanted=1
; 1 = never get a wanted level anywhere
NeverWanted=0
; 1 = every body you possess (people, not animals) gets all weapons
AutoGiveWeapons=0
; Money added per menu press to Michael, Franklin or Trevor
MoneyAmount=1000000
